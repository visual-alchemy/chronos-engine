services:
  chronos:
    build: .
    container_name: chronos-engine
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      - "10000-10049:10000-10049/udp"
    volumes:
      - ./media:/media:ro
      - ./config:/app/config:ro
      - chronos-data:/data
    environment:
      MEDIA_ROOT: /media
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_PATH: /data/chronos.db
      RUST_LOG: chronos_engine=info,tower_http=info
      GST_DEBUG: "3"
      LAN_IP: ${LAN_IP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chronos-data:
